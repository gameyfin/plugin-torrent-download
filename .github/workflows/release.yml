name: Release
on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: Version bump
        type: choice
        required: true
        default: patch
        options:
          - major
          - minor
          - patch
permissions:
  contents: read
jobs:
  release:
    uses: gameyfin/actions/.github/workflows/plugin-release.yml@c7d171d313b5421c796b9721af0d9202f488cef3
    with:
      actions_ref: c7d171d313b5421c796b9721af0d9202f488cef3
      version_bump: ${{ inputs.version_bump }}
    secrets: inherit
